<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stack Method</title>
<meta name="description" content="The Stack Method: language books that get you speaking, about 12 new words a night.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14122b;--paper:#fff8ea;--pop:#ff5a3c;--sun:#ffc93c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,Arial,sans-serif;font-weight:500;
  display:grid;place-items:center;padding:32px 22px;text-align:left}
main{max-width:720px;width:100%}
.tag{display:inline-block;background:var(--sun);border:3px solid var(--ink);padding:8px 14px;font-weight:700;font-size:1rem;margin:0 0 26px;box-shadow:5px 5px 0 var(--ink)}
h1{font-family:"Archivo Black","Arial Black",Arial,sans-serif;font-size:clamp(3rem,13vw,7rem);line-height:.92;letter-spacing:-.03em;margin:0 0 26px;text-transform:uppercase}
h1 span{color:var(--pop)}
p{font-size:clamp(1.15rem,2.6vw,1.45rem);line-height:1.5;margin:0 0 14px;max-width:32em}
.langs{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:26px 0 0}
.langs li{border:3px solid var(--ink);padding:8px 14px;font-weight:700;background:#fff}
</style>
</head>
<body>
<main>
  <p class="tag">Website coming soon</p>
  <h1>The <span>Stack</span> Method</h1>
  <p>Language books that get you speaking. About 12 new words a night, and every night stacks on the last.</p>
  <p>1,000 words per book.</p>
  <ul class="langs" aria-label="Languages">
    <li>Spanish</li><li>Urdu</li><li>Arabic (Egyptian)</li><li>Arabic (Saudi)</li><li>French</li><li>German</li>
  </ul>
</main>
</body>
</html>
